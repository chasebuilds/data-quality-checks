[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-checks"
version = "0.1.0"
description = "Declarative data-quality checks for CSV, Excel and Parquet files, run as DuckDB SQL, with a pass/fail report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chase Builds" }]
dependencies = ["duckdb>=1.1", "pyyaml>=6", "openpyxl>=3.1", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
dqc = "data_quality_checks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["data_quality_checks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["data_quality_checks", "benchmark"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "openpyxl.*"]
ignore_missing_imports = true
